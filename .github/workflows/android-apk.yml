name: Build SignalPilot Localhost 3001 APK

on:
  push:
    branches:
      - feat/android-localhost-3001-exact
  workflow_dispatch:

concurrency:
  group: android-localhost-3001-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Localhost 3001 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build canonical mobile core
        run: env -u NODE_OPTIONS npm run build:mobile-core

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SignalPilot-Localhost-3001-debug.apk

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalPilot-Localhost-3001-${{ github.sha }}
          path: dist/SignalPilot-Localhost-3001-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloadable Localhost 3001 APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: SignalPilot-Localhost-3001-${{ github.sha }}
          path: dist

      - name: Publish downloadable prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="android-localhost-3001-${GITHUB_SHA}"
          APK_PATH="dist/SignalPilot-Localhost-3001-debug.apk"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SignalPilot Localhost 3001 Android ${GITHUB_SHA:0:7}" \
              --notes "APK standalone al interfeței canonice localhost:3001, cu applicationId com.signalpilot.localhost3001 pentru instalare în paralel. Motorul rulează local pe telefon și scanează numai cât timp aplicația este în prim-plan. Fișier debug semnat automat: SignalPilot-Localhost-3001-debug.apk." \
              --prerelease
          fi
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/SignalPilot-Localhost-3001-debug.apk"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## SignalPilot Localhost 3001 APK"
            echo "[Descarcă SignalPilot-Localhost-3001-debug.apk]($DOWNLOAD_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
